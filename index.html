<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tu-vi – Lehrertool</title>
    <!-- Eine einzige theme-color, vom Skript unten passend gesetzt. Zwei
         Varianten nach prefers-color-scheme wuerden die eigene Wahl der
         Lehrkraft ignorieren und die Statusleiste falsch einfaerben. -->
    <meta name="theme-color" id="theme-color" content="#F2F2F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tu-vi" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2228%22%20fill%3D%22%234F5844%22%2F%3E%3Ctext%20x%3D%2264%22%20y%3D%2292%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%2C-apple-system%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%2286%22%20fill%3D%22%23F4F1E8%22%3ET%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <link rel="icon" type="image/png" sizes="180x180" href="./icon-180.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; worker-src 'self' blob:">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      /* Erscheinungsbild setzen, BEVOR das erste Pixel gezeichnet wird.
         Die Einstellung liegt eigentlich in den App-Daten, die erst nach dem
         Anmelden vom Server kommen - waerten wir darauf, blitzte die App
         kurz im falschen Modus auf. Deshalb spiegelt die App die Wahl
         zusaetzlich hier in localStorage. */
      (function () {
        try {
          var wahl = localStorage.getItem("tuvi_theme") || "auto";
          var dunkel = wahl === "dunkel" || (wahl === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dunkel ? "dark" : "light");
          var meta = document.getElementById("theme-color");
          if (meta) meta.setAttribute("content", dunkel ? "#000000" : "#F2F2F6");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
